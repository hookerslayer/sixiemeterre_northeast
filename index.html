<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sixième Terre</title>
    <link rel="stylesheet" href="map.css?v=military-ui-update-20261016b">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>

<div id="viewport">
    <div id="toast-notification" class="toast-notification"></div>
    <div id="game-calendar" class="game-calendar" aria-live="polite">
        <span id="game-turn-label">Ход 1 · Осень · 1450</span>
        <button id="advance-turn-btn" class="advance-turn-btn admin-only" style="display:none" type="button">Сменить ход</button>
    </div>

<div id="left-sidebar">
    <div class="top-nav-row">
        <button id="burger-menu-btn" class="burger-btn" title="Меню">☰</button>
        <button id="open-login-btn">Вход</button>
    </div>
    <div id="nav-dropdown-menu" class="nav-dropdown"></div>
    
    <div id="legend-panel">
        <div class="panel-header">
            <span class="legend-title">Легенда карты</span>
            <button id="legend-toggle-btn" class="toggle-btn" title="Свернуть/Развернуть">−</button>
        </div>
        <div id="legend-content">Загрузка...</div>
    </div>
</div>

    <div id="controls-panel">
        <div class="panel-header">
            <span class="panel-title">Управление</span>
            <button id="controls-toggle-btn" class="toggle-btn" title="Свернуть/Развернуть">−</button>
        </div>
        <div id="controls-content">
            <div class="search-box">
                <input type="number" id="search-input" placeholder="Поиск ID..." min="1">
                <button id="search-btn">ОК</button>
            </div>
            <button id="toggle-ids-btn">Показать ID</button>
            <button id="tracker-btn">Отслеживать координаты</button>
            
            <div id="admin-controls" class="layer-group admin-only" style="display: none;">
                <span class="layer-title">Администрирование</span>
                <button id="add-marker-mode-btn"> + Создать маркер</button>
                <label class="military-terrain-control">Местность / течение клетки
                    <select id="military-terrain-select">
                        <option value="plain">Равнина</option>
                        <option value="forest">Лес</option>
                        <option value="hill">Возвышенность</option>
                        <option value="marsh">Болото</option>
                        <option value="water">Вода</option>
                        <option value="bridge">Мост через воду</option>
                        <optgroup label="Направление течения реки">
                            <option value="flow:1,0">На восток →</option>
                            <option value="flow:1,1">На юго-восток ↘</option>
                            <option value="flow:0,1">На юг ↓</option>
                            <option value="flow:-1,1">На юго-запад ↙</option>
                            <option value="flow:-1,0">На запад ←</option>
                            <option value="flow:-1,-1">На северо-запад ↖</option>
                            <option value="flow:0,-1">На север ↑</option>
                            <option value="flow:1,-1">На северо-восток ↗</option>
                        </optgroup>
                    </select>
                </label>
                <button id="military-terrain-edit-btn" aria-pressed="false">Разметка военной карты: выкл.</button>
                <button id="sync-military-grid-btn" type="button">Пересчитать клетки по картам воды</button>
                <small id="sync-military-grid-status" aria-live="polite"></small>
                <button id="cancel-military-placement-btn" type="button" style="display:none">Отменить размещение армии</button>
            </div>

            <div class="layer-group">
                <span class="layer-title">Слои карты</span>
                <button id="toggle-trade-routes-btn">Торговые маршруты: скрыты</button>
                <button id="toggle-military-grid-btn" aria-pressed="false">Военная сетка: скрыта</button>
                <button class="layer-btn active" data-layer="political">Государства</button>
                <button class="layer-btn" data-layer="region">Регионы</button>
                <button class="layer-btn" data-layer="culture">Культуры</button>
                <button class="layer-btn" data-layer="religion">Религии</button>
                <button class="layer-btn" data-layer="resource">Ресурсы</button>
            </div>

            <div class="layer-group">
                <span class="layer-title">Маркеры</span>
                <button id="toggle-marker-names-btn" class="active">Названия маркеров</button>
                <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="large_city" checked> Крупные города</label>
                <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="city" checked> Города</label>
                <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="monastery" checked> Монастыри</label>
                <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="fortress" checked> Крепости</label>
                <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="ruins" checked> Руины</label>
            </div>
        </div>
    </div>

    <aside id="military-map-tools" class="military-map-tools" hidden aria-label="Инструменты военной карты">
        <details open>
            <summary>Строительство объектов</summary>
            <label>Объект<select id="map-structure-type"><option value="camp">Полевой лагерь</option><option value="watchtower">Сторожевая башня</option><option value="palisade">Засека</option><option value="bridge">Мост</option><option value="ferry">Волок</option><option value="river_port">Речной порт</option><option value="port">Морской порт</option></select></label>
            <label id="map-structure-settlement-wrap" hidden>Поселение<select id="map-structure-settlement"></select></label>
            <div id="map-structure-cost" class="map-structure-cost" aria-live="polite"></div>
            <label id="map-structure-source-wrap">Склад материалов<select id="map-structure-source"></select></label>
            <label id="map-structure-owner-wrap" hidden>Государство<select id="map-structure-owner"></select></label>
            <button id="map-structure-build" class="admin-btn" type="button">Выбрать клетку</button>
            <button id="map-structure-cancel" class="page-back-btn" type="button" hidden>Отмена</button>
            <small id="map-structure-status" aria-live="polite"></small>
        </details>
    </aside>

    <div id="map-finance-badge" class="map-finance-badge" hidden aria-live="polite"></div>

    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="login-modal-close" class="modal-close">&times;</span>
            <div class="modal-title">Авторизация</div>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Пароль">
            <button id="auth-login-btn">Вход</button>
            <button id="auth-reset-password-btn" class="auth-secondary-btn" type="button">Забыли пароль?</button>
            <div class="auth-register-link">
                <span id="open-register-btn">Регистрация</span>
            </div>
        </div>
    </div>

    <div id="password-recovery-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content">
            <span id="password-recovery-close" class="modal-close">&times;</span>
            <div class="modal-title">Новый пароль</div>
            <p>Введите новый пароль для своей учётной записи.</p>
            <input type="password" id="password-recovery-new" placeholder="Новый пароль" autocomplete="new-password">
            <input type="password" id="password-recovery-confirm" placeholder="Повторите пароль" autocomplete="new-password">
            <button id="password-recovery-submit" type="button">Сохранить пароль</button>
        </div>
    </div>

    <div id="register-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="register-modal-close" class="modal-close">&times;</span>
            <div class="modal-title">Регистрация</div>
            <input type="text" id="reg-nickname" placeholder="Имя пользователя / Никнейм">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-password" placeholder="Пароль">
            <input type="password" id="reg-password-confirm" placeholder="Повторите пароль">
            <button id="reg-submit-btn">Зарегистрироваться</button>
        </div>
    </div>

    <div id="map-wrapper">
        <img id="visual-map" src="map.png" alt="Карта провинций">
        <canvas id="layer-canvas"></canvas>
        <canvas id="military-grid-canvas" aria-hidden="true"></canvas>
        <img id="rivers-map" src="rivers.png" alt="Карта рек">
        <canvas id="trade-routes-canvas"></canvas>
        <canvas id="highlight-canvas"></canvas>
        <canvas id="markers-canvas"></canvas>
        <canvas id="labels-canvas"></canvas>
    </div>
    
    <div id="popup" class="popup">
        <span id="popup-close" class="popup-close">&times;</span>
        <div id="popup-content"></div>
    </div>

    <div id="page-view" class="page-view" aria-live="polite"></div>
    <section id="trade-route-editor" class="trade-route-editor" hidden aria-live="polite">
        <strong>Прокладка торгового маршрута</strong>
        <p id="trade-route-editor-status">Выберите соседние провинции на карте.</p>
        <div class="trade-route-editor-actions">
            <button id="trade-route-undo-btn" type="button">Отменить шаг</button>
            <button id="trade-route-clear-btn" type="button">Начать заново</button>
            <button id="trade-route-save-btn" type="button" disabled>Сохранить маршрут</button>
            <button id="trade-route-cancel-btn" type="button">Отмена</button>
        </div>
    </section>
</div>

<script type="module" src="main.js?v=military-ui-update-20261016b"></script>
</body>
</html>
