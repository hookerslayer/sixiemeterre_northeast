<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sixième Terre</title>
    <link rel="stylesheet" href="map.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="viewport">
    <div id="legend-panel">
        <div class="legend-title">Легенда карты</div>
        <div id="legend-content">Загрузка...</div>
    </div>

    <div id="controls-panel">
        <div class="search-box">
            <input type="number" id="search-input" placeholder="Поиск ID..." min="1">
            <button id="search-btn">ОК</button>
        </div>
        <button id="toggle-ids-btn">Показать ID</button>
        <button id="tracker-btn">Отслеживать координаты</button>
        
        <div class="layer-group">
            <span class="layer-title">Слои карты</span>
            <button class="layer-btn active" data-layer="political">Политическая карта</button>
            <button class="layer-btn" data-layer="region">Карта областей</button>
        </div>

        <div class="layer-group">
            <span class="layer-title">Маркеры</span>
            <button id="toggle-marker-names-btn" class="active">Названия маркеров</button>
            <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="large_city" checked> Крупные города</label>
            <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="city" checked> Города</label>
            <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="monastery" checked> Монастыри</label>
            <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="fortress" checked> Крепости</label>
            <label class="checkbox-label"><input type="checkbox" class="marker-type-checkbox" value="ruins" checked> Руины</label>
        </div>
    </div>

    <div id="map-wrapper">
        <img id="visual-map" src="map.png" alt="Карта провинций">
        <canvas id="layer-canvas"></canvas>
        <img id="rivers-map" src="rivers.png" alt="Карта рек">
        <canvas id="markers-canvas"></canvas>
        <canvas id="highlight-canvas"></canvas>
        <canvas id="labels-canvas"></canvas>
    </div>
    
    <div id="popup" class="popup">
        <span id="popup-close" class="popup-close">&times;</span>
        <div id="popup-content"></div>
    </div>
</div>

<script src="map.js"></script>
</body>
</html>
